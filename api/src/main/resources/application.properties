spring.application.name=api

spring.datasource.url=jdbc:postgresql://localhost:5432/pulse
spring.datasource.username=pulse
spring.datasource.password=pulse

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

logging.level.com.pulse.api=DEBUG

# In-process development limits. These buckets are local to each application instance.
pulse.rate-limit.login.capacity=5
pulse.rate-limit.login.refill-tokens=1
pulse.rate-limit.login.refill-period=PT12S
pulse.rate-limit.registration.capacity=3
pulse.rate-limit.registration.refill-tokens=1
pulse.rate-limit.registration.refill-period=PT20M
pulse.rate-limit.authenticated-api.capacity=60
pulse.rate-limit.authenticated-api.refill-tokens=1
pulse.rate-limit.authenticated-api.refill-period=PT1S
pulse.rate-limit.max-entries=100000
pulse.rate-limit.idle-ttl=PT30M
pulse.rate-limit.cleanup-interval=PT1M

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n
