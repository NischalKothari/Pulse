spring.application.name=api

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/pulse
spring.datasource.username=pulse
spring.datasource.password=pulse

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

logging.level.com.pulse.api=DEBUG

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [requestId=%X{requestId:-none}] %logger{36} - %msg%n